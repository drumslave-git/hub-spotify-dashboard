name: Release

# Ships a new image whenever the VERSION file changes on main. Bump it locally
# (`python tools/release.py patch` / `minor` / `major`) and push to main; this
# workflow verifies, tags the release, and pushes the image to GitHub's
# container registry (ghcr.io). No version change -> nothing runs.
on:
  push:
    branches: [main]
    # Only wake the workflow when the VERSION file is touched.
    paths:
      - "VERSION"
  # Run it by hand (Actions tab -> Release -> Run workflow) to publish the
  # current VERSION again, e.g. after a failed run.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        name: Compare VERSION against main before this push
        # Compare with the commit main pointed to before the push, not with
        # HEAD~1: a push of several commits may bump VERSION in an earlier one.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          current=$(tr -d '[:space:]' < VERSION)
          echo "version=$current" >> "$GITHUB_OUTPUT"
          previous=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Started by hand -> release the current version."
          elif [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ] \
               && git fetch -q --depth=1 origin "$BEFORE" \
               && git cat-file -e "$BEFORE:VERSION" 2>/dev/null; then
            previous=$(git show "$BEFORE:VERSION" | tr -d '[:space:]')
          fi
          echo "previous='$previous' current='$current'"
          if [ "$current" != "$previous" ]; then
            echo "Version changed -> release will run."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged -> nothing to release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    # This project has no linter or type checker, so the gate is a syntax
    # check plus the tests.
    name: Syntax check and tests
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q server.py spotify.py player.py docker-entrypoint.py tests tools
      - run: python -m unittest discover -s tests -v

  release:
    name: Tag and publish image
    needs: [version, verify]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Required so the workflow can push the release tag back to the repo.
      contents: write
      # Required to publish the image to GitHub's container registry.
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out the image name
        # ghcr.io/<owner>/<repo>, lower-cased as the registry requires.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Create and push release tag
        run: |
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin, skipping tag creation."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow's own token; no extra secrets to configure.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          # Reuse layers across runs to keep rebuilds fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max
