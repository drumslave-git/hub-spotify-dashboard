services:
  hubdash:
    # On the server: `docker compose pull && docker compose up -d` fetches the
    # published image. Locally, `docker compose up --build` builds from this
    # folder instead.
    image: ${HUBDASH_IMAGE:-ghcr.io/drumslave-git/hub-spotify-dashboard:latest}
    build: .
    container_name: hubdash
    restart: unless-stopped

    # Host networking (Linux): the service talks to the Hub on the LAN and the
    # page is served on PORT.
    network_mode: host

    # Holds the Spotify sign-in (spotify.json). Must be writable by uid 1000.
    volumes:
      - "${DATA_PATH:-./data}:/app/data"

    environment:
      # ---- Required: compose refuses to start until these are set in .env ----

      # The Nest Hub's IP. Give it a fixed DHCP lease on the router.
      HUB_HOST: ${HUB_HOST:?set HUB_HOST in .env to the Nest Hub's IP address}

      # Address the Hub loads the dashboard from. Must be https with a publicly
      # trusted certificate for Spotify to play inside the dashboard,
      # e.g. https://hub.example.com/
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env to the dashboard's https address}

      # Timezone of the clock, e.g. Europe/London
      TZ: ${TZ:?set TZ in .env to your timezone, e.g. Europe/London}

      # Weather location: the label shown on screen and its coordinates.
      WEATHER_NAME: ${WEATHER_NAME:?set WEATHER_NAME in .env to your town's name}
      WEATHER_LAT: ${WEATHER_LAT:?set WEATHER_LAT in .env to your latitude}
      WEATHER_LON: ${WEATHER_LON:?set WEATHER_LON in .env to your longitude}

      # Client ID of your Spotify app (developer.spotify.com). No secret needed.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?set SPOTIFY_CLIENT_ID in .env to your Spotify app's client ID}

      # ---- Optional: these have working defaults ----

      PORT: ${PORT:-8765}
      HOUR12: ${HOUR12:-false}

      # Where Spotify sends the browser after sign-in. Empty = PUBLIC_URL +
      # api/spotify/callback, which is what to enter in the Spotify app.
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      # Name the dashboard's own player shows up as in Spotify.
      SPOTIFY_PLAYER_NAME: ${SPOTIFY_PLAYER_NAME:-Dashboard}
      # Another Spotify device to start music on when the dashboard cannot play
      # by itself. Leave empty; naming the Hub here would make Spotify's own
      # app take over the Hub's screen.
      SPOTIFY_DEVICE: ${SPOTIFY_DEVICE:-}

      # Your own registered Cast app ID (empty = the public DashCast app).
      CAST_APP_ID: ${CAST_APP_ID:-}
      # Move Spotify sessions started on the Hub (e.g. by voice) into the dashboard.
      VOICE_TAKEOVER: ${VOICE_TAKEOVER:-true}

    healthcheck:
      # 127.0.0.1 (not localhost): the server binds IPv4 only.
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/health' % os.environ.get('PORT','8765'), timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
